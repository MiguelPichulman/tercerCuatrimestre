<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Food Store</title>
    <link rel="stylesheet" href="./registro.css">
</head>
<body>
    
    <main class="login-card">
        <h1 class="login-card__tittle">Food Store</h1>
        <h2>Crear Cuenta</h2>

        <form id="registro-form">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Nombre">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="ejemplo@ejemplo.com">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required minlength="6" placeholder="*********">

            <button type="submit" class="boton">Registrarse</button>
        </form>

        <p>
            ¿Ya tienes cuenta? <br><br>
            <a href="../login/login.html" class="link">Iniciar Sesión</a>
        </p>
    </main>

    <script type="module" src="./registro.ts"></script>
</body>
</html>
