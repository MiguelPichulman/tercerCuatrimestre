<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="./productDetail.css">
</head>
<body>
    <header class="header-principal">
        <h1 class="header-logo"><a href="../home/home.html">Food Store</a></h1>
        <nav class="header-nav">
            <a href="../home/home.html" class="nav-link">Volver a Tienda</a>
            <a href="../../client/orders/orders.html" class="nav-link">Mis Pedidos</a>
            
            <a href="../cart/cart.html" class="nav-link carrito-link">
                Ver Carrito <span id="cart-badge" class="badge">0</span>
            </a>
            
            <span id="user-name-display" class="nav-user-name"></span>
            <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </nav>
    </header>

    <main class="detalle-container">
        <div id="producto-detalle" class="producto-detalle-card">
            <h2 style="text-align: center; width: 100%; color: #888;">Cargando detalles del producto...</h2>
        </div>
    </main>

    <script type="module" src="./productDetail.ts"></script>
</body>
</html>
